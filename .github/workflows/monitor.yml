name: webseek-monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: webseek-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run webseek
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py --once --report-file .report.md

      - name: Create notification issue
        if: hashFiles('.report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "网页变化: $(head -1 .report.md | sed 's/^## //')" \
            --body-file .report.md

      - name: Commit state
        if: always()
        run: |
          git config user.name "webseek-bot"
          git config user.email "webseek-bot@users.noreply.github.com"
          for f in state.json changes.log snapshots; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet || {
            git commit -m "chore: 更新监控状态 $(date -u +%F_%T)"
            git push
          }