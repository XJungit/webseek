name: webseek-monitor

on:
  schedule:
    - cron: '*/15 * * * *'          # 每 15 分钟一轮 (降频, 减少 GitHub API 限流)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: webseek-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run webseek
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python monitor.py --once --report-file .report.md

      - name: Create notification issue
        if: hashFiles('.report.md') != ''
        continue-on-error: true        # 建 Issue 失败(如 API 限流)不拖红整轮
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(grep -c '^## ' .report.md)
          TITLE=$(head -1 .report.md | sed 's/^## //')
          if [ "$COUNT" -gt 1 ]; then TITLE="$TITLE 等 ${COUNT} 处变化"; fi
          gh issue create --title "网页变化: $TITLE" --body-file .report.md

      - name: Notify on failure
        if: failure()
        env:
          MAIL_SMTP_HOST: ${{ secrets.MAIL_SMTP_HOST }}
          MAIL_SMTP_PORT: ${{ secrets.MAIL_SMTP_PORT }}
          MAIL_SMTP_USER: ${{ secrets.MAIL_SMTP_USER }}
          MAIL_SMTP_PASSWORD: ${{ secrets.MAIL_SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          import yaml, notify
          cfg = yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}
          notify.send_email(cfg.get('notify', {}),
              'webseek 监控运行失败',
              '本轮监控执行失败, 请查看: https://github.com/XJungit/webseek/actions')
          "

      - name: Commit state
        if: always()
        continue-on-error: true        # 推送失败不拖红整轮, 避免失败 Issue 雪崩
        run: |
          git config user.name "webseek-bot"
          git config user.email "webseek-bot@users.noreply.github.com"
          for f in state.json changes.log snapshots; do
            [ -e "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "状态无变化, 无需提交"
            exit 0
          fi
          git commit -m "chore: 更新监控状态 [skip ci] $(date -u +%F_%T)"
          # 先提交再同步: 带着未暂存改动执行 pull --rebase 会直接报
          # "cannot pull with rebase: You have unstaged changes", 一旦远端
          # 同时前进, 这次的变化基线就推不上去了.
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push || { git pull --rebase origin "${GITHUB_REF_NAME}"; git push; }

      - name: Create failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "监控运行失败 $(date -u +%F)" \
            --body "本轮监控执行失败, 请查看 Actions 日志: https://github.com/XJungit/webseek/actions"
